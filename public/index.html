<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭资产管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 登录/注册页面 -->
    <div id="auth-page" class="page">
      <div class="auth-container">
        <h1>家庭资产管理系统</h1>
        <div class="tabs">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>
        
        <form id="login-form" class="auth-form">
          <input type="text" id="login-username" placeholder="用户名" required>
          <input type="password" id="login-password" placeholder="密码" required>
          <button type="submit">登录</button>
        </form>
        
        <form id="register-form" class="auth-form hidden">
          <input type="text" id="register-username" placeholder="用户名" required>
          <input type="password" id="register-password" placeholder="密码 (至少6位)" required>
          <input type="password" id="register-confirm" placeholder="确认密码" required>
          <button type="submit">注册</button>
        </form>
        
        <p id="auth-error" class="error"></p>
      </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page hidden">
      <header>
        <h1>家庭资产管理</h1>
        <div class="user-info">
          <span id="current-user"></span>
          <button id="logout-btn">退出</button>
        </div>
      </header>

      <nav class="main-nav">
        <button class="nav-btn active" data-view="dashboard">资产概览</button>
        <button class="nav-btn" data-view="assets">资产明细</button>
      </nav>

      <!-- 资产概览 -->
      <div id="dashboard-view" class="view">
        <div class="stats-cards">
          <div class="stat-card">
            <h3>净资产</h3>
            <p id="total-assets">¥0.00</p>
          </div>
          <div class="stat-card">
            <h3>预期年收益</h3>
            <p id="expected-annual-return">¥0.00</p>
          </div>
          <div class="stat-card">
            <h3>资产数量</h3>
            <p id="assets-count">0</p>
          </div>
        </div>
        
        <!-- 饼图区域 -->
        <div class="charts-section">
          <div class="chart-card">
            <h3>资产配置</h3>
            <div class="pie-chart-container">
              <svg id="category-pie" class="pie-chart" viewBox="0 0 100 100"></svg>
              <div id="category-legend" class="chart-legend"></div>
            </div>
          </div>
          <div class="chart-card">
            <h3 id="subtype-title">固收明细</h3>
            <div class="pie-chart-container">
              <svg id="subtype-pie" class="pie-chart" viewBox="0 0 100 100"></svg>
              <div id="subtype-legend" class="chart-legend"></div>
            </div>
          </div>
        </div>
        
        <div class="recent-assets">
          <h3>资产详情</h3>
          <div id="recent-list"></div>
        </div>
      </div>

      <!-- 资产明细 -->
      <div id="assets-view" class="view hidden">
        <div class="assets-header">
          <h2>资产列表</h2>
          <button id="add-asset-btn" class="btn-primary">添加资产</button>
        </div>
        <div id="assets-list"></div>
      </div>

      <!-- 添加/编辑资产弹窗 -->
      <div id="asset-modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="modal-title">添加资产</h3>
          <form id="asset-form">
            <input type="hidden" id="asset-id">
            <div class="form-group">
              <label>资产名称</label>
              <input type="text" id="asset-name" required>
            </div>
            <div class="form-group">
              <label>资产类型</label>
              <select id="asset-category" required>
                <option value="">请选择类型</option>
                <option value="现金">现金</option>
                <option value="固收">固收</option>
                <option value="权益">权益</option>
                <option value="另类">另类</option>
                <option value="负债">负债</option>
              </select>
            </div>
            <div class="form-group">
              <label>资产子类</label>
              <select id="asset-type" required>
                <option value="">请先选择类型</option>
              </select>
            </div>
            <div class="form-group">
              <label>金额 (元)</label>
              <input type="number" id="asset-amount" step="0.01" required>
            </div>
            <div class="form-group">
              <label>本金 (元)</label>
              <input type="number" id="asset-principal" step="0.01" placeholder="用于计算收益，不填则等于金额">
            </div>
            <div class="form-group">
              <label>预期年化收益率 (%)</label>
              <input type="number" id="asset-expected-return" step="0.01" placeholder="默认为0">
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="asset-description"></textarea>
            </div>
            <div class="form-actions">
              <button type="button" id="cancel-btn">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
