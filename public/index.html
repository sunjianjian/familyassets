<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭资产管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 登录/注册页面 -->
    <div id="auth-page">
      <div class="auth-container">
        <h1>家庭资产管理系统</h1>
        <div class="tabs">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>
        
        <form id="login-form" class="auth-form">
          <input type="text" id="login-username" placeholder="用户名" required>
          <input type="password" id="login-password" placeholder="密码" required>
          <button type="submit">登录</button>
        </form>
        
        <form id="register-form" class="auth-form hidden">
          <input type="text" id="register-username" placeholder="用户名" required>
          <input type="password" id="register-password" placeholder="密码 (至少6位)" required>
          <input type="password" id="register-confirm" placeholder="确认密码" required>
          <button type="submit">注册</button>
        </form>
        
        <p id="auth-error" class="error"></p>
      </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="hidden">
      <header>
        <h1>家庭资产管理</h1>
        <div class="user-info">
          <span id="current-user"></span>
          <button id="logout-btn">退出</button>
        </div>
      </header>

      <nav class="main-nav">
        <button class="nav-btn active" data-view="dashboard">总览</button>
        <button class="nav-btn" data-view="assets">资产管理</button>
        <button class="nav-btn" data-view="goals">目标管理</button>
        <button class="nav-btn" data-view="categories">类别管理</button>
      </nav>

      <!-- 资产概览 -->
      <div id="dashboard-view" class="view">
        <!-- 总览卡片：净资产 + 资产/目标视图切换 -->
        <div class="overview-card">
          <div class="overview-header">
            <div class="overview-label-row">
              <span class="overview-title">净资产</span>
              <p id="total-assets">¥0</p>
              <span id="net-annual-return" class="header-return">年收益 ¥0</span>
            </div>
            <div class="overview-toggle" role="tablist" aria-label="总览视图切换">
              <button type="button" class="overview-toggle-btn active" data-overview="assets"
                      role="tab" aria-selected="true" title="资产视图" aria-label="资产视图">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M8 2.5V8l4.8 2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="overview-toggle-btn" data-overview="goals"
                      role="tab" aria-selected="false" title="目标视图" aria-label="目标视图">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="8" cy="8" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 资产视图：左饼图，右资产列表 -->
          <div id="overview-assets" class="overview-panel overview-assets">
            <div class="overview-pie">
              <svg id="category-pie" class="pie-chart" viewBox="0 0 100 100"></svg>
              <div id="category-legend" class="chart-legend"></div>
            </div>
            <div class="overview-asset-list">
              <h3>分类资产</h3>
              <div id="recent-list"></div>
            </div>
          </div>

          <!-- 目标视图 -->
          <div id="overview-goals" class="overview-panel overview-goals hidden">
            <h3>目标达成</h3>
            <div id="goal-progress-list"></div>
          </div>
        </div>
      </div>

      <!-- 资产管理 -->
      <div id="assets-view" class="view hidden">
        <div class="assets-header">
          <h2>资产列表</h2>
          <button id="add-asset-btn" class="btn-primary">添加资产</button>
        </div>
        <div id="assets-list"></div>
      </div>

      <!-- 目标管理 -->
      <div id="goals-view" class="view hidden">
        <div class="assets-header">
          <h2>目标列表</h2>
          <button id="add-goal-btn" class="btn-primary">添加目标</button>
        </div>
        <div id="goals-list"></div>
      </div>

      <!-- 类别管理 -->
      <div id="categories-view" class="view hidden">
        <div class="assets-header">
          <h2>资产类别</h2>
          <button id="add-category-btn" class="btn-primary">添加类别</button>
        </div>
        <p class="view-hint">自定义资产大类与子类，拖拽卡片可调整顺序；修改后立即应用于资产录入、分类统计与图表。</p>
        <div id="categories-list"></div>
      </div>

      <!-- 添加/编辑资产弹窗 -->
      <div id="asset-modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="modal-title">添加资产</h3>
          <form id="asset-form">
            <input type="hidden" id="asset-id">
            <div class="form-group">
              <label>资产名称</label>
              <input type="text" id="asset-name" required>
            </div>
            <div class="form-group">
              <label>资产类型</label>
              <select id="asset-category" required>
                <option value="">请选择类型</option>
              </select>
            </div>
            <div class="form-group">
              <label>资产子类</label>
              <select id="asset-type" required>
                <option value="">请先选择类型</option>
              </select>
            </div>
            <div class="form-group">
              <label>金额 (元)</label>
              <input type="number" id="asset-amount" step="0.01" required>
            </div>
            <div class="form-group">
              <label>本金 (元)</label>
              <input type="number" id="asset-principal" step="0.01" placeholder="用于计算收益，不填则等于金额">
            </div>
            <div class="form-group">
              <label>预期年化收益率 (%)</label>
              <input type="number" id="asset-expected-return" step="0.01" placeholder="默认为0">
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="asset-description"></textarea>
            </div>
            <div class="form-actions">
              <button type="button" id="cancel-btn">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 添加/编辑目标弹窗 -->
      <div id="goal-modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="goal-modal-title">添加目标</h3>
          <form id="goal-form">
            <input type="hidden" id="goal-id">
            <div class="form-group">
              <label>目标名称</label>
              <input type="text" id="goal-name" required>
            </div>
            <div class="form-group">
              <label>目标金额 (元)</label>
              <input type="number" id="goal-amount" step="0.01" required>
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="goal-description"></textarea>
            </div>
            <div class="form-actions">
              <button type="button" id="goal-cancel-btn">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>
      <!-- 添加/编辑类别弹窗 -->
      <div id="category-modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="category-modal-title">添加类别</h3>
          <form id="category-form">
            <input type="hidden" id="category-id">
            <div class="form-group">
              <label>类别名称</label>
              <input type="text" id="category-name" placeholder="如：现金、固收、权益" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>颜色</label>
                <input type="color" id="category-color" value="#6366f1">
              </div>
              <div class="form-group">
                <label class="checkbox-label">
                  <input type="checkbox" id="category-liability">
                  <span>计入负债</span>
                </label>
                <small class="form-hint">勾选后该类别金额从净资产中扣除</small>
              </div>
            </div>
            <div class="form-group">
              <label>资产子类</label>
              <div id="subtype-inputs" class="subtype-inputs"></div>
              <button type="button" id="add-subtype-btn" class="btn-ghost">+ 添加子类</button>
            </div>
            <div class="form-actions">
              <button type="button" id="category-cancel-btn">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
